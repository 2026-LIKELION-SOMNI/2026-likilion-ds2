name: Deploy (systemd-lite)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH pull & restart via systemd
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            set -e

            echo "=== 1. Pull latest code ==="
            cd ${{ secrets.REPO_DIR }}
            git checkout main
            git pull origin main

            echo "=== 2. Activate Python 3.10 virtualenv ==="
            source ${{ secrets.REPO_DIR }}/myvenv/bin/activate

            echo "Python version:"
            python --version

            echo "Python path:"
            which python

            echo "=== 3. Install dependencies ==="
            cd ${{ secrets.APP_DIR }}

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            echo "=== 4. Django migration ==="
            python manage.py migrate --noinput

            echo "=== 5. Restart uWSGI ==="
            sudo systemctl restart uwsgi
            sudo systemctl status uwsgi --no-pager

            echo "=== 6. Reload Nginx ==="
            sudo nginx -t
            sudo systemctl reload nginx

            echo "=== Deployment complete ==="